repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-ast
      - id: check-json
      - id: check-merge-conflict
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: no-commit-to-branch
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --force-exclude --config pyproject.toml --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format --force-exclude --config pyproject.toml
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

  - repo: local
    hooks:
        - id: mypy
          args: ["--install-types", "--explicit-package-bases", "--ignore-missing-imports", "--scripts-are-modules", "--non-interactive"]
          entry: uv run mypy
          language: system
          name: mypy
          require_serial: true
          types_or: [python, pyi]
