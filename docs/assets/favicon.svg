<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Data Contract Checker logo">
  <title>Data Contract Checker</title>
  <!-- circular badge (dbt-bouncer family palette) -->
  <circle cx="120" cy="120" r="118" fill="#130912"/>
  <circle cx="120" cy="120" r="113" fill="none" stroke="#fafafa" stroke-width="2"/>
  <circle cx="120" cy="120" r="108" fill="none" stroke="#d1d1d1" stroke-width="1"/>

  <!-- contract document with a folded corner -->
  <path d="M84 60 H150 L172 82 V174 a6 6 0 0 1 -6 6 H90 a6 6 0 0 1 -6 -6 V66 a6 6 0 0 1 6 -6 Z" fill="#fafafa"/>
  <path d="M150 60 V82 H172 Z" fill="#d1d1d1"/>
  <!-- text lines -->
  <rect x="98" y="86" width="48" height="6" rx="3" fill="#d1d1d1"/>
  <rect x="98" y="102" width="36" height="6" rx="3" fill="#d1d1d1"/>
  <rect x="98" y="118" width="44" height="6" rx="3" fill="#d1d1d1"/>

  <!-- coral approval stamp with a check mark -->
  <g transform="rotate(-12 150 150)">
    <circle cx="150" cy="150" r="30" fill="#ff694a"/>
    <circle cx="150" cy="150" r="23" fill="none" stroke="#fafafa" stroke-width="2" stroke-dasharray="3 3"/>
    <path d="M136 150 l9 10 l19 -23" fill="none" stroke="#fafafa" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
