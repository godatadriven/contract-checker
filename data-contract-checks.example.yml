# EXAMPLE configuration for contract-checker.
#
# To use it in your own project, copy this file to `data-contract-checks.yml`
# (the default path the CLI looks for) and adapt the paths and checks:
#
#   cp data-contract-checks.example.yml data-contract-checks.yml
#
# In this repository it runs against the DCS test fixtures:
#
#   make validate-examples
#
# The checks reflect common governance rules (ownership, documentation, approved
# platforms). Several fixtures break some of them, so you can see what failures
# look like.
# Full reference: https://godatadriven.github.io/contract-checker/config/

# Which standard the contracts follow: dcs, odcs or custom.
data_contract_specification: dcs

# Where the contracts live. include_paths / exclude_paths take optional globs.
data_contracts_path:
  path: ./tests/fixtures/dcs/
  # include_paths:
  #   - 1.2.*/**
  # exclude_paths:
  #   - "**/draft_*.yaml"

# Also validate each contract against its full JSON Schema. Off by default;
# the --lint / --no-lint CLI option overrides this.
# lint: true

data_contract_checks:
  # Ownership & discoverability: every contract has an accountable owner,
  # a point of contact and enough context to be found in a catalog.
  - attribute: id
    checks:
      - required: true
      - pattern: ^[a-z0-9]+(-[a-z0-9]+)*$   # kebab-case, e.g. orders-latest

  - attribute: info.owner
    checks:
      - required: true

  - attribute: info.contact.name
    checks:
      - required: true

  - attribute: info.description
    checks:
      - required: true

  - attribute: info.version
    checks:
      - required: true
      - pattern: ^\d+\.\d+\.\d+$          # semantic versioning

  - attribute: tags
    checks:
      - required: true
      - min_items: 1                        # at least one tag for search

  # Terms: consumers must know what they may use the data for.
  - attribute: terms.usage
    checks:
      - required: true

  # Infrastructure: only platforms and environments your organisation supports.
  - attribute: servers.*.type
    checks:
      - accepted_values:
          - s3
          - bigquery
          - snowflake
          - databricks
          - postgres

  - attribute: servers.*.environment
    checks:
      - accepted_values:
          - prod
          - staging
          - dev

  # Models: at least one, each documented and with a primary key.
  - attribute: models
    checks:
      - min_items: 1

  - attribute: models.*.description
    checks:
      - required: true

  - attribute: models.*.type
    checks:
      - accepted_values:
          - table
          - view

  - attribute: models.*.fields
    checks:
      - at_least_one:                       # use exactly_one to forbid composite keys
          primaryKey: true

  # Fields: every column is typed and documented.
  - attribute: models.*.fields.*.type
    checks:
      - required: true

  - attribute: models.*.fields.*.description
    checks:
      - required: true
