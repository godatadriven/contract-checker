
# Config
data_contract_specification: dcs

data_contracts_path:
  path: ./data_contracts/
  include_paths:
    - /domain/
    - /source/
  include_custom:
    - field: info.status
      value: active
    - field: info.status
      value: active
  exclude_paths:
    - "/marts/**"
  exclude_custom:
    - field: info.deprecated
      value: true


# Severity options (1)
data_contract_check_severity:
  info:
    title: fail
  models:
    fields:
      unique: warn
      examples: warn

# Severity options (2)
# data_contract_check_severity: warn

data_contract_checks:
# Info checks
  # - attribute: info.contact.email
  #   checks:
  #     - required: true
  #     - pattern: "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,7}"

# Model checks
  - attribute: models.*.fields.*.examples
    checks:
      - min_items: 1
