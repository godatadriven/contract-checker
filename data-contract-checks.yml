
# Config
data_contracts_path:
  path: ./tests/fixtures/dcs/
  include_paths:
    - 0.9.3/**
  include_custom:
    - field: info.status
      value: active
    - field: info.status
      value: active
  exclude_paths:
    - 1.2.1/**
  exclude_custom:
    - field: info.deprecated
      value: true

data_contract_specification: dcs

# Severity options (1)
data_contract_check_severity:
  info:
    title: fail
  models:
    fields:
      unique: warn
      examples: warn

# Severity options (2)
# data_contract_check_severity: warn

data_contract_checks:
# Info checks
  - attribute: info.title
    checks:
      - required: true
      - pattern: ^Orders

  - attribute: info.version
    checks:
      - accepted_values: 1.0.0

  - attribute: tags
    checks:
      - accepted_values:
        - example
        - test

  - attribute: servers.type
    checks:
      - accepted_values:
          - s3
          - gcs
          - azure_blob

  - attribute: examples.data.location
    checks:
      - accepted_values:
          - table

  - attribute: info.version
    checks:
      - required: true
      - pattern: ^\d+\.\d+\.\d+$


# # Model checks
#   - attribute: models.fields
#     checks:
#       - required: true
#       - min_items: 1

# Model field checks
  - attribute: models.*.fields.*.unique
    checks:
      - required: true

  - attribute: models.*.fields.*.examples
    checks:
      - required: true
      - min_items: 2
