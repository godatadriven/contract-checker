
# Config
data_contracts_path:
  path: ./tests/fixtures/dcs/
  include_paths:
  include_custom:
    - field: info.status
      value: active
    - field: info.status
      value: active
  exclude_paths:
  exclude_custom:
    - field: info.deprecated
      value: true

data_contract_specification: dcs

# Validate each contract against its full JSON Schema (built-in DCS/ODCS schema,
# or a custom_schema_path). Off by default; also toggleable with --lint/--no-lint.
# lint: true

# Severity options (1)
data_contract_check_severity:
  info:
    title: fail
  models:
    fields:
      unique: warn
      examples: warn

# Severity options (2)
# data_contract_check_severity: warn

data_contract_checks:
# Info checks
  - attribute: info.title
    checks:
      - required: true
      - pattern: ^Orders

  - attribute: info.version
    checks:
      - accepted_values: 0.0.1

  - attribute: tags
    checks:
      - accepted_values:
        - example
        - test

  - attribute: servers.*.type
    checks:
      - accepted_values:
          - s3
          - gcs
          - azure_blob

  - attribute: examples.data.location
    checks:
      - accepted_values:
          - table

  - attribute: info.version
    checks:
      - required: true
      - pattern: ^\d+\.\d+\.\d+$


# # Model checks
#   - attribute: models.fields
#     checks:
#       - required: true
#       - min_items: 1

# Model field checks
  - attribute: models.*.fields.*.description
    checks:
      - required: true

  - attribute: models.*.fields.*.type
    checks:
      - required: true
