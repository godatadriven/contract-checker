name: Update schema versions

# Periodically vendors newly published ODCS and DCS schema versions and opens a PR.
# Schema support is filesystem-driven, so adding a version is just dropping its
# schema.json into src/contract_checker/contract_schemas/{spec}/{version}/.

on:
  schedule:
    # 06:00 UTC on the 1st of every month (matches the dependabot cadence).
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-schemas
  cancel-in-progress: false

jobs:
  update-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version-file: ".python-version"
          enable-cache: true

      - name: Sync environment
        run: uv sync --dev

      - name: Vendor new schema versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/update_schemas.py

      - name: Run tests
        run: uv run pytest

      - name: Create or update pull request
        # Opens a PR only when there is a diff; updates the existing branch/PR on re-run.
        uses: peter-evans/create-pull-request@v7
        with:
          # CI (ci.yml) only runs on the PR when it is opened by a non-GITHUB_TOKEN
          # identity. Create a fine-grained PAT scoped to this repo with Contents:
          # read/write and Pull requests: read/write, store it as the SCHEMA_BOT_TOKEN
          # secret, and CI runs on the schema-update PRs automatically. Without the
          # secret this falls back to the default token and CI must be kicked off manually.
          token: ${{ secrets.SCHEMA_BOT_TOKEN || github.token }}
          branch: automation/update-schemas
          base: main
          commit-message: "chore: vendor new ODCS/DCS schema versions"
          title: "chore: vendor new ODCS/DCS schema versions"
          delete-branch: true
          add-paths: |
            src/contract_checker/contract_schemas/**
            tests/fixtures/**
            README.md
            docs/index.md
          body: |
            Automated update from `.github/workflows/update-schemas.yml`.

            This PR vendors newly published ODCS / DCS schema versions, refreshes the
            version ranges in `README.md` and `docs/index.md`, and scaffolds a starter
            test fixture per new version. See the workflow run summary for the exact
            versions added.

            **Reviewer checklist**
            - [ ] Confirm the vendored `schema.json` files match upstream.
            - [ ] Review scaffolded fixtures — they are copies of the previous version
                  with the version field bumped and may not satisfy new required fields.
            - [ ] Consider whether the new version(s) warrant dedicated checks.
