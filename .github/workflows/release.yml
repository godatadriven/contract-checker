name: Release

on:
  release:
    types: [published]

# Never run two publishes for the same release concurrently — a partial
# re-run could race the immutable PyPI upload. Don't cancel an in-flight
# publish either.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history + tags required for setuptools-scm to resolve the version.

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version-file: ".python-version"
          enable-cache: true

      # Verification gate: PyPI uploads are immutable, so prove the tagged
      # commit passes its tests before we build and publish it.
      - name: Run tests
        run: uv run pytest

      - name: Build sdist and wheel
        run: uv build

      - name: List built artifacts
        run: ls -l dist/

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/contract_checker
    permissions:
      id-token: write  # OIDC token for PyPI Trusted Publishing (no stored secrets).
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true  # Re-running a release must not fail on an already-uploaded version.
