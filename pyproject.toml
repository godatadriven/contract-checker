[project]
name = "contract_checker"
description = "Data contract checker"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.16"
dynamic = ["version"]
authors = [
    {name = "Thom van Engelenburg"},
    {name = "Sonu Jacob"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "typer>=0.26.8",
    "pydantic>=2.13.3",
    "pyyaml>=6",
    "jsonschema>=4.0",
    "rich>=13",
]

[dependency-groups]
lint = [
    "ruff==0.16.9",
    "mypy==2.3.1",
    "types-PyYAML",
]

docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocs-typer2>=0.4.1",
    "mkdocstrings[python]>=1.0.4",
    "pymdown-extensions>=11.0.1",
]

dev = [
    "pytest>=9.1.1",
    "pre-commit>=4.6.0,<5",
]

[tool.uv]
default-groups = ["dev", "lint"]
required-version = ">=0.13.4"

[project.scripts]
contract-checker = "contract_checker.cli:app"

[build-system]
requires = ["setuptools==84.0.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# Presence of this (empty) table activates setuptools-scm, which derives the
# version from the latest `vX.Y.Z` git tag.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the vendored standard schemas (DCS / ODCS) so schema validation ("lint")
# works from a pip-installed package, not just from the repo checkout.
contract_checker = ["contract_schemas/**/*.json"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
disallow_untyped_defs = true

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]


line-length = 120
indent-width = 4

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle
    "I",   # isort
    "ANN", # flake8 type annotations
    "RUF", # ruff-specific rules
]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
